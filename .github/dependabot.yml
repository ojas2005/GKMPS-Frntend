# Monthly update PRs, grouped so they arrive as one PR per ecosystem. Security fixes are raised
# separately and straight away (Dependabot security updates are on for this repository).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    groups:
      angular: { patterns: ["@angular/*", "@angular-devkit/*", "@schematics/angular"], update-types: [minor, patch] }
      other: { patterns: ["*"], update-types: [minor, patch] }
