name: Deploy to production

# Every change that lands on main goes live on the Static Web App (gkmps-portal), so
# production never lags behind main. It can also be run by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits for the one in flight instead of racing it.
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  # The production API. The app reads it from config.json at runtime, so the same build
  # works anywhere; this is the only place production's address is set. It must also be
  # allowed in connect-src in public/staticwebapp.config.json.
  API_BASE_URL: https://gkmps-api.salmonpebble-295fb50e.koreacentral.azurecontainerapps.io

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Point the build at the production API
        run: |
          printf '{\n  "apiBaseUrl": "%s"\n}\n' "$API_BASE_URL" > dist/school-erp/browser/config.json
          cat dist/school-erp/browser/config.json
          test -f dist/school-erp/browser/staticwebapp.config.json

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist/school-erp/browser
          output_location: ""
          skip_app_build: true
          skip_api_build: true
